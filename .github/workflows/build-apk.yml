name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Tambah izin Android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in INTERNET ACCESS_NETWORK_STATE ACCESS_WIFI_STATE; do
            grep -q "$p" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\"/>\n    <application#" $M
          done
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: netcheck-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
