      - name: Pasang Google Services (login Google)
        run: |
          test -f google-services.json || { echo "google-services.json belum ada di root repo"; exit 1; }
          cp google-services.json android/app/
          sed -i "s#classpath 'com.android.tools.build:gradle:#classpath 'com.google.gms:google-services:4.4.2'\n        classpath 'com.android.tools.build:gradle:#" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          echo "--- cek build.gradle ---"
          grep -n "google-services" android/build.gradle android/app/build.gradle
          grep -q "com.google.gms:google-services" android/build.gradle || { echo "GAGAL: classpath tidak masuk"; exit 1; }
          grep -q "com.google.gms.google-services" android/app/build.gradle || { echo "GAGAL: plugin tidak masuk"; exit 1; }
