name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Tambah izin Android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in INTERNET ACCESS_NETWORK_STATE ACCESS_WIFI_STATE CHANGE_WIFI_STATE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS VIBRATE CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "$p" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\"/>\n    <application#" $M
          done
      - name: Pasang plugin native WiFi
        run: |
          D=android/app/src/main/java/com/netcheck/app
          mkdir -p $D
          cp android-native/*.java $D/
      - name: Pasang Google Services (login Google)
        run: |
          test -f google-services.json || { echo "google-services.json belum ada di root repo"; exit 1; }
          cp google-services.json android/app/
          sed -i "s#classpath 'com.android.tools.build:gradle:#classpath 'com.google.gms:google-services:4.4.2'\n        classpath 'com.android.tools.build:gradle:#" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          echo "--- cek build.gradle ---"
          grep -n "google-services" android/build.gradle android/app/build.gradle
          grep -q "com.google.gms:google-services" android/build.gradle || { echo "GAGAL: classpath tidak masuk"; exit 1; }
          grep -q "com.google.gms.google-services" android/app/build.gradle || { echo "GAGAL: plugin tidak masuk"; exit 1; }
      - name: Pasang debug keystore tetap (SHA-1 stabil)
        run: |
          if [ -f netcheck-debug.keystore ]; then mkdir -p ~/.android && cp netcheck-debug.keystore ~/.android/debug.keystore; fi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: netcheck-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
