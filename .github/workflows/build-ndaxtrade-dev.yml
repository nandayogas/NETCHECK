# Build APK NdaxTrade Dev (terpisah dari APK NETCHECK/NdaxTrade utama).
name: Build NdaxTrade Dev APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: cp capacitor.ndaxdev.json capacitor.config.json
      - run: npx vite build --mode ndaxdev
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ndaxtrade-dev-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
